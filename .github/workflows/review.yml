name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    # A fork's token is read-only, so posting the review would fail. Skip
    # fork pull requests entirely instead of turning the job red.
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@v0.6.0
        with:
          # Pin the binary too: the ref pin only governs the composite
          # action wrapper, and an empty version input tracks
          # releases/latest, so publishing v0.7.0 upstream would switch
          # every review run here with no change in this repo.
          version: v0.6.0
          model_id: deepseek/deepseek-v4-flash-0731
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}
